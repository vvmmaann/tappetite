# UNTITLED PICK GAME · placeholder name on isverifiedby.me
# Cloudflare proxy in front (Full Strict), this nginx terminates with Origin Cert
# Created 2026-05-04 by claude-code deploy chunk 1.6
# Updated 2026-05-04 chunk 7a: added /api/ proxy to FastAPI backend on 127.0.0.1:8001

server {
    listen 80;
    listen [::]:80;
    server_name isverifiedby.me www.isverifiedby.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name isverifiedby.me www.isverifiedby.me;

    ssl_certificate     /etc/ssl/private/isverifiedby/cloudflare-origin.crt;
    ssl_certificate_key /etc/ssl/private/isverifiedby/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Cloudflare real client IP — IPv4 ranges (Cloudflare-published list)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6 ranges
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    root /opt/untitled-pick-game;
    index game.html;

    # ──────────────────────────────────────────────────────────────
    # BACKEND API · proxy /api/* to FastAPI on 127.0.0.1:8001
    # ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        client_max_body_size 256k;
    }


    # ──────────────────────────────────────────────────────────────
    # CHALLENGE LANDING + DYNAMIC OG + INVITE LINKS · proxy to FastAPI.
    # /c/{slug}      - server-rendered game.html with personalized og:* meta
    # /og/{slug}.png - per-challenge OG card (rendered SVG, cached on disk)
    # /i/{nickname}  - smart invite-link router added 2026-05-16. UA-sniffs
    #                  and 302s to Play Store (Android) or web/?ref= (iOS/desktop).
    #                  Sets tappetite_ref cookie as 30-day fallback.
    # ──────────────────────────────────────────────────────────────
    location ~ ^/(c|og|i)/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Service worker MUST always be fetched fresh — otherwise PWAs get stuck
    # on old SW versions for hours after deploy (Cloudflare caches by default).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        # Audit re-review LOW: dup security headers since add_header doesn't inherit.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    # PWA manifest — short cache so app name/icon changes propagate within 1h.
    location = /manifest.json {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    # Android APK download — direct file with Android-specific MIME type
    # and a Content-Disposition that triggers "save as" rather than a
    # browser preview. No-cache: we ship updates fast, don't want users
    # stuck on an old build.
    location = /download/tappetite-latest.apk {
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="tappetite.apk"' always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # PostHog reverse proxy (analytics). Bypasses ad-blockers that
    # blacklist posthog.com. SDK in game.html targets api_host=
    # "https://isverifiedby.me/ph". All requests under /ph/ forward
    # to eu.i.posthog.com (EU region).
    #
    # Audit-6 P0: STRIP all auth + identity headers before forwarding.
    # The browser auto-attaches our app cookies (upg_session,
    # upg_admin_v3) to same-origin /ph/* requests because the cookies
    # are scoped to path="/". HttpOnly does NOT prevent that — it only
    # prevents JS from reading the cookie. PostHog must not see our
    # session tokens.
    # We also intentionally do NOT forward client IP (X-Real-IP /
    # X-Forwarded-For): PostHog sees only event payload, not the
    # real-user app auth context. PostHog will see all requests as
    # coming from our nginx box's public IP — acceptable granularity
    # for product analytics, much stronger privacy posture.
    location /ph/ {
        proxy_pass https://eu.i.posthog.com/;
        proxy_http_version 1.1;
        proxy_set_header Host eu.i.posthog.com;
        # Audit-6 P0 + audit-7 P1.1: blank EVERY upstream header that could
        # leak app auth context or real-user identity to PostHog. Cloudflare
        # is in front of us, so its CF-* headers are the primary IP-leak
        # vector — stripping just X-Real-IP / X-Forwarded-For (audit-6
        # initial fix) was insufficient.
        # Auth context:
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        # IP / forwarding identity (Cloudflare and standards):
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header CF-RAY "";
        proxy_set_header CF-Visitor "";
        proxy_set_header True-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Server "";
        # User context (browsing history / device fingerprinting surface):
        proxy_set_header Referer "";
        # NB: User-Agent intentionally LEFT INTACT — PostHog uses it for
        # browser/device breakdown which is product-analytics-legitimate
        # and doesn't itself identify a person beyond browser/OS family.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Set-Cookie;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

# SPA-style fallback: any unmatched path returns the game.
    # HTML must always be revalidated — no stale UI in PWAs after deploy.
    location / {
        try_files $uri $uri/ /game.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Security headers MUST be repeated in each location that already
        # has add_header (nginx does not inherit add_header from server
        # block when child has any). See audit CHUNK 5.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        # Audit-6 M5: CSP in REPORT-ONLY mode. Broad observational policy
        # that doesn't break the app. We allow inline scripts/styles
        # because game.html relies on them heavily; over time we'll narrow
        # via nonce + extract inline → external. For now this header
        # exists to surface unexpected loads (e.g. supply-chain attack
        # injecting evil.com/script.js) into browser dev console without
        # blocking legitimate ones.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https://isverifiedby.me; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Security headers (audit CHUNK 5)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: tell browsers to use HTTPS for this domain for 1 year, including
    # all subdomains. Once a browser has seen this header, it will refuse
    # http:// even if the user types it. preload eligibility postponed —
    # we should be sure we never need an http subdomain before submitting.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # X-Frame-Options: prevent clickjacking by disallowing embedding in iframes.
    add_header X-Frame-Options "DENY" always;
    # Permissions-Policy: turn off browser features we don't use.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Per-vhost logs so verifire's old logs don't get polluted
    access_log /var/log/nginx/isverifiedby.access.log;
    error_log  /var/log/nginx/isverifiedby.error.log;
}
