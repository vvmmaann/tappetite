<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF6F0"/>
      <stop offset="1" stop-color="#F0E9DD"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.05 0"/>
    </filter>
  </defs>

  <!-- Paper background with grain -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.55"/>

  <!-- HEADER: brand only (magazine "issue/date" framing was vestigial noise) -->
  <text x="60" y="68" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="20" letter-spacing="5" fill="#8A7A6A">TAPPETITE</text>
  <line x1="60" y1="92" x2="280" y2="92" stroke="#C9BBA8" stroke-width="1"/>

  <!-- KICKER: category -->
  <text x="60" y="148" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="22" letter-spacing="4" fill="#B5532E">В ТУРНИРЕ</text>
  <text x="60" y="218" font-family="DejaVu Serif, Georgia, serif" font-style="italic" font-weight="500" font-size="62" fill="#1A1F36" letter-spacing="-2">«{{CATEGORY}}»</text>

  <!-- DIVIDER -->
  <line x1="60" y1="282" x2="1140" y2="282" stroke="#C9BBA8" stroke-width="1"/>

  <!-- AUTHOR LINE -->
  <text x="60" y="332" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="20" letter-spacing="4" fill="#8A7A6A">ВЫЗОВ ОТ</text>
  <text x="60" y="382" font-family="DejaVu Serif, Georgia, serif" font-style="italic" font-size="44" fill="#1A1F36">@{{NICKNAME}}</text>

  <!-- HIDDEN TOP-3 (mirrors welcome-screen "? · откроется после прохождения") -->
  <text x="600" y="475" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif" font-style="italic" font-size="56" fill="#B5532E" letter-spacing="8">? · ? · ?</text>
  <text x="600" y="518" text-anchor="middle" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="18" letter-spacing="4" fill="#8A7A6A">ОТКРОЕТСЯ ПОСЛЕ ТВОЕГО ПРОХОЖДЕНИЯ</text>

  <!-- FOOTER: domain + CTA -->
  <line x1="60" y1="555" x2="1140" y2="555" stroke="#C9BBA8" stroke-width="1"/>
  <text x="60" y="595" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="20" letter-spacing="3" fill="#8A7A6A">isverifiedby.me</text>
  <text x="1140" y="595" font-family="DejaVu Sans Mono, JetBrains Mono, monospace" font-size="22" letter-spacing="4" fill="#B5532E" text-anchor="end">→ ПРИНЯТЬ ВЫЗОВ</text>
</svg>
