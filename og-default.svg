  <line x1="60" y1="110" x2="540" y2="110" stroke="#C9BBA8" stroke-width="1"/>

  <text x="60" y="240" font-family="Georgia, 'Playfair Display', serif" font-style="italic" font-weight="500" font-size="98" fill="#1A1F36" letter-spacing="-3">Турниры выбора.</text>
  <text x="60" y="350" font-family="Georgia, 'Playfair Display', serif" font-style="italic" font-weight="500" font-size="98" fill="#B5532E" letter-spacing="-3">Профиль вкуса.</text>

  <line x1="60" y1="430" x2="1140" y2="430" stroke="#C9BBA8" stroke-width="1"/>

  <text x="60" y="478" font-family="Georgia, 'Playfair Display', serif" font-style="italic" font-size="28" fill="#4A4035">13 категорий · 8 минут на выпуск · твой типаж в конце</text>

  <text x="60" y="585" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" letter-spacing="4" fill="#8A7A6A">isverifiedby.me</text>
  <text x="1140" y="585" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" letter-spacing="4" fill="#B5532E" text-anchor="end">→ TAP TO PLAY</text>
